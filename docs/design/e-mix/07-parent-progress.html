<style>
/* ===== Tokens ===== */
:root{

  --s1:#2a6fc2; --s2:#c4601a; --s3:#a03a7c; --grid:#e3ebe8; --axis:#9fb1ae;
  --h1:#7dbfa5; --h1t:#14272a; --h2:#4fa387; --h2t:#0a1d17; --h3:#2c7c62; --h3t:#ffffff; --h4:#1a5a47; --h4t:#ffffff; --h5:#0d3a2e; --h5t:#ffffff; --hnone:#eef3f1;
  --f1:#f9d6e0; --f2:#fbdcc2; --f3:#f6eaa6; --f4:#cbeacb; --f5:#c9ddf6; --f6:#e1d7f5;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-body:"Andika","Segoe UI",system-ui,sans-serif;
  /* spacing scale 4 8 12 16 24 32 48; radius 8 / 14 / 999 */
  --r1:8px; --r2:14px; --r3:999px;
  --scrim:rgba(20,39,42,.5); --gold:#f2c94c; --pip-trunk:#9a7048; --pip-fruit:#e4572e;
  --st-line:#14272a; --st-face:#fffdf3; --st-orange:#f0a24b; --st-brown:#b98a5c; --st-grey:#b4c3c7; --st-dgrey:#5d6f74; --st-yellow:#f6d046; --st-green:#79c47f; --st-pink:#f5a5b8;

}

  --s1:#4f92dd; --s2:#d4702f; --s3:#d0609c; --grid:#27373c; --axis:#4d6469;
  --h1:#2a7a63; --h1t:#ffffff; --h2:#4a9f84; --h2t:#0a1d17; --h3:#72c0a3; --h3t:#0a1d17; --h4:#a2dcc4; --h4t:#0a1d17; --h5:#d2f2e3; --h5t:#0a1d17; --hnone:#1d2b30;
  --f1:#5a3040; --f2:#5b3d23; --f3:#55501f; --f4:#2a4b30; --f5:#25415f; --f6:#40356a;
  --scrim:rgba(0,0,0,.62); --gold:#e0b030; --pip-trunk:#8d6a48; --pip-fruit:#ef7a56;
  --st-line:#14272a; --st-face:#f3efe2; --st-orange:#e8a04a; --st-brown:#b08157; --st-grey:#a3b4b8; --st-dgrey:#5d7278; --st-yellow:#ecc53c; --st-green:#62b86d; --st-pink:#e792a8;
  --sk1:#5c9ae0; --sk2:#e08c4a; --sk3:#cfae3a; --sk4:#5fb77a; --sk5:#d77fa6; --sk6:#9a8fe0; --sk7:#4fb3bc;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f191c; --card:#172226; --card2:#1d2b30; --paper:#1b2a2e;
  --ink:#e8f0ed; --ink2:#bdcdc9; --muted:#9db1ad;
  --line:#33474d; --line2:#27383d; --line-strong:#6f878c;
  --accent:#62c7a2; --accent-soft:#1e3b32; --on-accent:#0a1d16;
  --maths:#8fbff4; --maths-soft:#1d3045; --english:#f2a96c; --english-soft:#3b2b1b; --exam:#b5a9f6; --exam-soft:#2b2850;
  --stamp:#b5a9f6; --stamp-soft:#2b2850;
  --ok-bg:#1e3b32; --ok-line:#62c7a2; --ok-ink:#c3ecdc;
  --note-bg:#3a2f1c; --note-line:#b48a36; --note-ink:#f2dba9;
  --focus:#93bbff; --shadow:0 1px 0 rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.7);
  --pip-body:#e5b95c; --pip-leaf:#5cb585; --pip-bloom:#e07d97; --pip-soil:#6b5340; --pip-cheek:#e3866a; --pip-line:#0f191c;
  --s1:#4f92dd; --s2:#d4702f; --s3:#d0609c; --grid:#27373c; --axis:#4d6469;
  --h1:#2a7a63; --h1t:#ffffff; --h2:#4a9f84; --h2t:#0a1d17; --h3:#72c0a3; --h3t:#0a1d17; --h4:#a2dcc4; --h4t:#0a1d17; --h5:#d2f2e3; --h5t:#0a1d17; --hnone:#1d2b30;
  --f1:#5a3040; --f2:#5b3d23; --f3:#55501f; --f4:#2a4b30; --f5:#25415f; --f6:#40356a;
  --scrim:rgba(0,0,0,.62); --gold:#e0b030; --pip-trunk:#8d6a48; --pip-fruit:#ef7a56;
  --st-line:#14272a; --st-face:#f3efe2; --st-orange:#e8a04a; --st-brown:#b08157; --st-grey:#a3b4b8; --st-dgrey:#5d7278; --st-yellow:#ecc53c; --st-green:#62b86d; --st-pink:#e792a8;
  --sk1:#5c9ae0; --sk2:#e08c4a; --sk3:#cfae3a; --sk4:#5fb77a; --sk5:#d77fa6; --sk6:#9a8fe0; --sk7:#4fb3bc;
  color-scheme:dark}
/* Calm: bright fills become plain paper, companion goes quiet, nothing animates */
:root[data-calm="1"]{
  --pip-body:var(--card2); --pip-leaf:var(--accent-soft); --pip-bloom:var(--card2); --pip-cheek:var(--line);
  --stamp-soft:var(--card2); --accent-soft:var(--card2); --ok-bg:var(--card2); --note-bg:var(--card2);
  --maths-soft:var(--card2); --english-soft:var(--card2); --exam-soft:var(--card2);
  --pip-fruit:var(--card2); --pip-trunk:var(--line-strong); --gold:var(--card2);
  --st-orange:var(--st-grey); --st-yellow:var(--st-face); --st-green:var(--st-grey); --st-pink:var(--st-face); --st-brown:var(--st-grey);
  --sk1:var(--card2); --sk2:var(--card2); --sk3:var(--card2); --sk4:var(--card2); --sk5:var(--card2); --sk6:var(--card2); --sk7:var(--card2);
}
/* ===== Base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:clamp(30px,4.2vw,44px)} h2{font-size:26px} h3{font-size:20px} h4{font-size:17px}
p{margin:0} a{color:inherit}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
main{padding-block:32px 72px}
.stack{display:grid;gap:24px}
.stack>*{min-width:0}
.label{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:15px} .num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
/* ===== Top bar ===== */
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r1);z-index:30;font-weight:700}
.skip:focus{left:8px}
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;min-height:56px;padding-block:4px}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;gap:8px;padding-right:8px}
.brand svg{width:26px;height:26px}
.nav-wide{display:flex;gap:0;flex-wrap:wrap;flex:1;min-width:0}
.nav-wide a,.tb-link,.tb-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 9px;font-size:15px;color:var(--ink2);text-decoration:none;border-radius:var(--r1);gap:6px}
.nav-wide a b{font-weight:700;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-wide a:hover,.tb-link:hover,.tb-btn:hover{background:var(--card2);color:var(--ink)}
.nav-wide a[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent);border-radius:0}
.tb-btn{border:1px solid var(--line-strong);background:transparent;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.tb-btn[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb-btn .dot{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;display:inline-block}
.tb-btn[aria-checked="true"] .dot{background:currentColor}
.tb-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav-narrow{display:none}
.nav-narrow summary{list-style:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;font-size:15px;color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r1)}
.nav-narrow summary::-webkit-details-marker{display:none}
.nav-narrow div{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding-top:6px;width:100%}
.nav-narrow a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;text-decoration:none;color:var(--ink2);font-size:16px;border-radius:var(--r1)}
.nav-narrow a[aria-current="page"]{font-weight:700;color:var(--ink);background:var(--card2)}
@media(max-width:1020px){.nav-wide,.tb-right .tb-link{display:none}.nav-narrow{display:block}.nav-narrow[open]{flex-basis:100%;order:5}.tb-right{margin-left:auto}}
@media(max-width:480px){.tb-btn{padding:0 10px;font-size:14px}.brand{font-size:17px}}
/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r3);border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:var(--line-strong);font-weight:400;color:var(--ink2)}
.btn:hover{filter:brightness(1.07)} .btn[disabled]{opacity:.55;cursor:default}
.btn.big{min-height:56px;font-size:20px;padding:0 30px;font-family:var(--f-display);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button,.seg a{min-height:44px;min-width:44px;padding:0 16px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink2);border-radius:var(--r3);font:inherit;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg [aria-pressed="true"],.seg [aria-current="true"],.seg [aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);font-weight:700;text-underline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:24px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.panel{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);padding:16px 20px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:var(--r3);border:1.5px dashed var(--line-strong);font-size:14px;font-weight:700;color:var(--ink2);background:var(--card)}
.pbar{height:10px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:var(--r3)}
.pbar.m>i{background:var(--maths)} .pbar.e>i{background:var(--english)}
@media(max-width:700px){body{font-size:17px}main{padding-block:20px 56px}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root[data-calm="1"] *{animation:none!important}
@media print{.topbar,.noprint{display:none!important}body{background:var(--card)}}
/* ===== Reward levels: Full / Light / Minimal ===== */
:root[data-reward="light"] .rw-full{display:none!important}
:root[data-reward="minimal"] .rw-full,:root[data-reward="minimal"] .rw{display:none!important}
.rw-min{display:none}
:root[data-reward="minimal"] .rw-min{display:block}
:root[data-calm="1"] .no-calm{display:none!important}
.calm-only{display:none}
:root[data-calm="1"] .calm-only{display:inline-flex}
/* ===== Ink marks (levels) and words ===== */
.ink{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.ink svg{width:18px;height:18px;display:block}
.ink .sh{fill:none;stroke:var(--ink);stroke-width:2}
.ink .on .sh{fill:var(--ink)}
.word{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;min-width:74px}
.word::before{content:"";width:14px;height:14px;display:inline-block;flex:none;box-sizing:border-box;border:2px solid var(--ink)}
.word.done::before{background:var(--ink);border-radius:50%;border-color:var(--ink)}
.word.going::before{border-radius:50%;background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.word.new::before{border-radius:3px;border-style:dotted}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:15px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* ===== Pip and stamps ===== */
.pip{display:block;width:100%;height:auto;max-width:170px}
.pip .o{stroke:var(--pip-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pip-body{fill:var(--pip-body)} .pip-leaf{fill:var(--pip-leaf)} .pip-bloom{fill:var(--pip-bloom)} .pip-soil{fill:var(--pip-soil);stroke:none!important}
.pip-eye{fill:var(--pip-line)} .pip-cheek{fill:var(--pip-cheek);opacity:.55} .pip-stem{fill:none}
.pip-core{fill:var(--pip-body)}
.pip.mini{width:44px;max-width:44px}
@keyframes nod{0%{transform:translateY(0)}40%{transform:translateY(4px) rotate(-3deg)}100%{transform:translateY(0)}}
@keyframes grow{from{transform:scale(.88)}to{transform:scale(1)}}
.nod{animation:nod .4s ease-out 1;transform-origin:50% 90%}
.grow{animation:grow .6s ease-out 1;transform-origin:50% 100%}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.stamp{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 8px}
.stamp svg{width:92px;height:92px}
.stamp .ring{fill:var(--stamp-soft);stroke:var(--stamp);stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.stamp .rim{fill:none;stroke:var(--stamp);stroke-width:3}
.stamp .ic{fill:none;stroke:var(--stamp);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.stamp.locked .ring,.stamp.locked .rim,.stamp.locked .ic{stroke:var(--line-strong);fill:none;stroke-dasharray:none}
.stamp.locked .ring{stroke-dasharray:3 6}
.stamp .txt{display:grid;gap:2px}
.stamp b{font-size:16px;line-height:1.25} .stamp small{font-size:14px;color:var(--muted)}
.stamp.new svg{animation:grow .5s ease-out 1}
.stamp-plain{display:none}
:root[data-calm="1"] .stamp svg{display:none}
:root[data-calm="1"] .stamp{grid-template-columns:auto 1fr;justify-items:start;text-align:left;border-bottom:1px solid var(--line2);padding:8px 0}
:root[data-calm="1"] .stamps{grid-template-columns:1fr;gap:0}
:root[data-calm="1"] .stamp-plain{display:inline-flex;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:15px}
:root[data-calm="1"] .stamp.locked .stamp-plain{border-style:dashed;color:var(--muted);border-color:var(--line-strong)}
:root[data-calm="1"] .stamp .txt{display:grid;gap:0}
.ring-bg{stroke:var(--line);fill:none} .ring-fg{stroke:var(--accent);fill:none;stroke-linecap:round}
.token{display:inline-flex;align-items:center;gap:8px}
.token svg{width:26px;height:26px}

/* ===== Pip ladder parts ===== */
.pip-trunk{fill:var(--pip-trunk)} .pip-fruit{fill:var(--pip-fruit)} .pip-gold{fill:var(--gold)}
.pip-sil *{fill:var(--line)!important;stroke:var(--line-strong)!important} .pip-sil .pip-stem{fill:none!important} .pip-sil .det{display:none} .pip-sil .pip-soil{fill:var(--line2)!important;stroke:none!important}
.pip.mini2{max-width:84px}
/* ===== Stamp art ===== */
.stampart{display:block;width:100%;height:auto}
.stampart .so{stroke:var(--st-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.stampart .sl{fill:none;stroke:var(--st-line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stampart .sl.gl{stroke-width:2.2} .stampart .sl.gf{fill:var(--st-face);stroke-width:2}
.stampart .sf,.stampart .f-face{fill:var(--st-face)} .stampart .f-orange{fill:var(--st-orange)} .stampart .f-brown{fill:var(--st-brown)} .stampart .f-grey{fill:var(--st-grey)} .stampart .f-dgrey{fill:var(--st-dgrey)}
.stampart .f-yellow{fill:var(--st-yellow)} .stampart .f-green{fill:var(--st-green)} .stampart .f-pink,.stampart .f-ear{fill:var(--st-pink)}
.stampart .sd{fill:var(--st-line);stroke:none} .stampart .sw{fill:var(--st-face);stroke:none} .stampart .sc{fill:var(--pip-cheek);opacity:.6;stroke:none}
.stampart .sbadge{fill:var(--st-face)} .stampart .gx{fill:var(--st-line);font-family:var(--f-display);font-weight:500;stroke:none}
.stampart .so.gold{fill:var(--gold)}
.stampart .sb{fill:var(--sk1)} .stampart.sk2 .sb{fill:var(--sk2)} .stampart.sk3 .sb{fill:var(--sk3)} .stampart.sk4 .sb{fill:var(--sk4)} .stampart.sk5 .sb{fill:var(--sk5)} .stampart.sk6 .sb{fill:var(--sk6)} .stampart.sk7 .sb{fill:var(--sk7)} .stampart.gold .sb{fill:var(--gold)}
.stampart.sil *{fill:var(--line)!important;stroke:var(--line-strong)!important} .stampart.sil .det{display:none} .stampart.sil .sb{fill:var(--line2)!important;stroke-dasharray:5 5} .stampart.sil .sbadge{fill:var(--line2)!important}
/* ===== Album tiles ===== */
