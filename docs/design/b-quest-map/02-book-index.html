* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; padding-top: 24px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { width: 28px; height: 28px; }
.menu > summary { list-style: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; font-weight: 800; }
.menu > summary::-webkit-details-marker { display: none; }
.menu nav { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
.menu nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 0.95rem; }
.menu nav a:hover { background: var(--accent-tint); }
.menu nav a[aria-current='page'] { background: var(--accent); color: var(--on-accent); }
.tb-btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: 800 0.95rem var(--body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.tb-btn:hover { border-color: var(--accent); }
@media (min-width: 1000px) {
  .menu { order: 2; flex: 1 1 auto; }
  .menu > summary { display: none; }
  .menu nav { padding: 0; justify-content: center; }
  .brand { margin-right: 0; }
}
@media (max-width: 999px) { .menu { flex-basis: 100%; order: 5; } }

/* buttons, chips */
.btn { min-height: 48px; padding: 0 22px; border-radius: 14px; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); font: 800 1.05rem var(--body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent-ink); }
.btn.maths { background: var(--maths); border-color: var(--maths); color: var(--on-maths); }
.btn.english { background: var(--english); border-color: var(--english); color: var(--on-english); }
.btn.small { min-height: 44px; padding: 0 16px; font-size: 0.95rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 12px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); font-weight: 800; font-size: 0.85rem; }
.chip.m { background: var(--maths-tint); color: var(--maths-ink); }
.chip.e { background: var(--english-tint); color: var(--english-ink); }
.chip.hint { background: var(--hint-tint); color: var(--hint); }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 3px; gap: 3px; }
.seg button, .seg a { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: 800 0.95rem var(--body); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
.seg [aria-pressed='true'], .seg [aria-selected='true'], .seg [aria-current='true'] { background: var(--accent); color: var(--on-accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.demo-panel { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 14px; border: 2px dashed var(--line); border-radius: 16px; background: var(--card-2); }
.demo-panel .lbl { font-weight: 800; font-size: 0.85rem; color: var(--muted); }

/* companion */
.buddy { display: block; width: 100%; height: auto; overflow: visible; }
.buddy .pose { transform-origin: 60px 100px; transform-box: view-box; }
.buddy-b { fill: var(--buddy); stroke: var(--buddy-deep); stroke-width: 2.5; }
.buddy-d { fill: var(--buddy-deep); }
.buddy-belly { fill: var(--buddy-belly); }
.buddy-eye { fill: var(--buddy-eye); }
.buddy-cheek { fill: var(--buddy-cheek); opacity: 0.8; }
.buddy-mouth { fill: none; stroke: var(--buddy-eye); stroke-width: 2.4; stroke-linecap: round; }
.buddy-scarf { fill: var(--scarf); }
.buddy-gold { fill: var(--gold-fill); }
.buddy-petal { fill: var(--petal); }
.buddy-pole { stroke: var(--sign-ink); stroke-width: 3; stroke-linecap: round; }
.buddy .spark { fill: var(--gold-fill); opacity: 0; }
@keyframes nod { 0%,100% { transform: translateY(0); } 40% { transform: translateY(4px); } }
@keyframes tilt { 0% { transform: rotate(0); } 50%,100% { transform: rotate(-11deg); } }
@keyframes twinkle { 0% { opacity: 0; transform: scale(0.4); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
.react-nod .pose { animation: nod 0.5s ease-out 1; }
.react-nod .spark { animation: twinkle 0.55s ease-out 1; }
.react-tilt .pose { animation: tilt 0.45s ease-out 1 forwards; }
.react-nod .spark.s2 { animation-delay: 0.08s; }
.react-nod .spark.s3 { animation-delay: 0.16s; }
.calm-off .react-nod .pose, .calm-off .react-nod .spark, .calm-off .react-tilt .pose { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .react-nod .pose, .react-nod .spark, .react-tilt .pose { animation: none; }
  .react-tilt .pose { transform: rotate(-8deg); }
  .react-nod .spark { opacity: 1; }
  * { scroll-behavior: auto !important; transition: none !important; }
}
body[data-rewards='minimal'] .reward { display: none !important; }
body[data-rewards='quiet'] .reward.loud { display: none !important; }

/* map scenery */
.land { fill: var(--land); }
.land2 { fill: var(--land-2); }
.water { fill: var(--water); }
.trail-line { fill: none; stroke: var(--trail); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 2 11; }
.trail-line.lit { stroke: var(--trail-lit); stroke-dasharray: none; stroke-width: 6; }
.tree { fill: var(--buddy-deep); opacity: 0.55; }
.trunk { fill: var(--trail); }

/* stars (three steps) */
.steps { display: flex; gap: 6px; align-items: flex-end; }
.step { display: inline-flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 44px; padding: 4px 8px 4px; border-radius: 8px 8px 4px 4px; border: 2px solid var(--line); background: var(--card); font-size: 0.78rem; font-weight: 800; color: var(--ink); line-height: 1.15; }
.step.s-1 { min-height: 38px; }
.step.s-2 { min-height: 50px; }
.step.s-3 { min-height: 62px; }
.step.done { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); }
.step.try { background: var(--hint-tint); border-color: var(--hint); color: var(--hint); border-style: dashed; }
.step .mk { font-size: 1rem; line-height: 1; }

.head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; }
.sub { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.trail { list-style: none; margin: 0 auto; padding: 36px 0 8px; max-width: 760px; position: relative; }
.stop { position: relative; min-height: 196px; --x: 30%; }
.stop:nth-child(even) { --x: 70%; }
.stop:last-child { min-height: 110px; }
.stop > svg.leg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.stop .pm { display: none; }
.node { position: absolute; left: var(--x); top: 0; width: 52px; height: 52px; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; font: 600 1.35rem var(--display); border: 4px solid var(--trail); background: var(--card); color: var(--ink); z-index: 2; }
.node.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.node.going { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 5px var(--accent-tint); }
.node .badge { position: absolute; right: -8px; bottom: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-ink); }
.here { position: absolute; left: var(--x); top: 0; width: 70px; transform: translate(-50%, -112%); z-index: 3; margin-top: -4px; }
.sc { position: absolute; top: -26px; left: calc(var(--x) + 46px); width: 360px; max-width: calc(100% - var(--x) - 46px); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; display: grid; gap: 6px; box-shadow: var(--shadow); z-index: 1; }
.stop:nth-child(even) .sc { left: auto; right: calc(100% - var(--x) + 46px); max-width: calc(var(--x) - 46px); width: 360px; }
.sc h3 { font-size: 1.05rem; }
.sc .r1 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sign { display: inline-block; background: var(--sign); color: var(--sign-ink); font: 600 1rem var(--display); padding: 3px 20px 3px 10px; clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%); white-space: nowrap; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; font-weight: 800; padding: 2px 9px; border-radius: 99px; border: 2px solid var(--line); min-height: 26px; }
.pip.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-ink); }
.sc a.go { font-weight: 800; min-height: 44px; display: inline-flex; align-items: center; }
.scen { position: absolute; top: 70px; width: 54px; opacity: 1; z-index: 0; }
.stop:nth-child(odd) .scen { left: 2%; width: 44px; } .stop:nth-child(even) .scen { right: 2%; width: 44px; }
.list { display: none; }
body[data-view='list'] .trail { display: none; }
body[data-view='list'] .list { display: block; }
.list ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.list .n { font: 600 1.2rem var(--display); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent-ink); }
.list .st { font-size: 0.85rem; color: var(--muted); }
.list a { font-weight: 800; min-height: 44px; display: inline-flex; align-items: center; }
.pebbles { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; max-width: 760px; margin: 0 auto; padding: 0; list-style: none; }
.pebbles a { min-height: 56px; border-radius: 28px 28px 22px 22px; border: 3px solid var(--trail); background: var(--card); display: grid; place-items: center; text-decoration: none; color: var(--ink); font: 600 1.1rem var(--display); }
.pebbles a.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
@media (max-width: 700px) {
  .stop { --x: 11%; min-height: 176px; }
  .stop:nth-child(even) { --x: 21%; }
  .stop .pd { display: none; } .stop .pm { display: inline; }
  .stop .sc, .stop:nth-child(even) .sc { left: calc(var(--x) + 36px); right: 0; width: auto; max-width: none; top: -26px; padding: 10px 12px; }
  .node { width: 44px; height: 44px; font-size: 1.15rem; }
  .here { display: none; }
  .scen { display: none; }
  .list li { grid-template-columns: 40px minmax(0, 1fr); }
  .list li > :last-child { grid-column: 2; }
}
</style>

/* ---- shared helpers ---- */
(function () {
  var root = document.documentElement;
  function effective() {
    var t = root.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  try { var saved = localStorage.getItem('hb-b-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  var tb = document.getElementById('themeBtn');
  function label() { if (tb) tb.querySelector('span').textContent = effective() === 'dark' ? 'Light' : 'Dark'; }
  if (tb) tb.addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('hb-b-theme', next); } catch (e) {}
    label();
    document.dispatchEvent(new Event('hb-theme'));
  });
  label();
  var menu = document.getElementById('menu');
  function fit() { if (menu) menu.open = window.matchMedia('(min-width: 1000px)').matches; }
  fit(); window.addEventListener('resize', fit);
})();

/* Sprig, the companion. stage 1 seed, 2 sprout, 3 sapling, 4 bloom. Never sick or sad. */
function stageFor(level) { return level >= 10 ? 4 : level >= 6 ? 3 : level >= 3 ? 2 : 1; }
function buddySVG(o) {
  o = o || {};
  var st = o.stage || 3, acc = o.acc || [];
  var rx = [26, 31, 35, 37][st - 1], ry = [24, 29, 32, 34][st - 1], cy = 104 - ry;
  var g = '';
  var leaf = function (d) { return '<path class="buddy-b" d="' + d + '"/>'; };
  g += '<ellipse class="buddy-d" cx="' + (60 - rx * 0.5) + '" cy="106" rx="9" ry="5"/><ellipse class="buddy-d" cx="' + (60 + rx * 0.5) + '" cy="106" rx="9" ry="5"/>';
  g += '<ellipse class="buddy-b" cx="60" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"/>';
  g += '<ellipse class="buddy-belly" cx="60" cy="' + (cy + ry * 0.35) + '" rx="' + rx * 0.55 + '" ry="' + ry * 0.5 + '"/>';
  var top = cy - ry;
  g += '<path class="buddy-d" d="M60 ' + (top + 3) + ' L60 ' + (top - 6) + '" stroke="none"/>';
  g += leaf('M60 ' + (top + 2) + ' C52 ' + (top - 14) + ' 38 ' + (top - 12) + ' 36 ' + (top - 6) + ' C44 ' + (top + 2) + ' 52 ' + (top + 4) + ' 60 ' + (top + 2) + 'Z');
  if (st >= 2) g += leaf('M60 ' + (top + 2) + ' C68 ' + (top - 18) + ' 82 ' + (top - 16) + ' 84 ' + (top - 8) + ' C76 ' + (top + 2) + ' 68 ' + (top + 4) + ' 60 ' + (top + 2) + 'Z');
  if (st >= 3) g += leaf('M60 ' + (top + 2) + ' C58 ' + (top - 20) + ' 60 ' + (top - 26) + ' 64 ' + (top - 28) + ' C66 ' + (top - 16) + ' 64 ' + (top - 4) + ' 60 ' + (top + 2) + 'Z');
  var ey = cy - ry * 0.12;
  g += '<ellipse class="buddy-eye" cx="' + (60 - rx * 0.36) + '" cy="' + ey + '" rx="3.4" ry="4.2"/><ellipse class="buddy-eye" cx="' + (60 + rx * 0.36) + '" cy="' + ey + '" rx="3.4" ry="4.2"/>';
  g += '<circle class="buddy-cheek" cx="' + (60 - rx * 0.6) + '" cy="' + (ey + 7) + '" r="4.5"/><circle class="buddy-cheek" cx="' + (60 + rx * 0.6) + '" cy="' + (ey + 7) + '" r="4.5"/>';
  g += '<path class="buddy-mouth" d="M' + (60 - 6) + ' ' + (ey + 8) + ' Q60 ' + (ey + 14) + ' ' + (60 + 6) + ' ' + (ey + 8) + '"/>';
  if (st >= 3 || acc.indexOf('scarf') >= 0) {
    var sy = cy + ry * 0.62;
    g += '<path class="buddy-scarf" d="M' + (60 - rx * 0.78) + ' ' + sy + ' Q60 ' + (sy + 14) + ' ' + (60 + rx * 0.78) + ' ' + sy + ' L' + (60 + rx * 0.7) + ' ' + (sy + 8) + ' Q60 ' + (sy + 22) + ' ' + (60 - rx * 0.7) + ' ' + (sy + 8) + 'Z"/>';
    g += '<path class="buddy-scarf" d="M' + (60 + rx * 0.4) + ' ' + (sy + 10) + ' l8 17 l-9 2z"/>';
  }
  if (st >= 4 || acc.indexOf('flower') >= 0) {
    var fx = 60, fy = top - 24;
    for (var i = 0; i < 5; i++) { var a = i * 72 * Math.PI / 180; g += '<circle class="buddy-petal" cx="' + (fx + Math.sin(a) * 6.5).toFixed(1) + '" cy="' + (fy - Math.cos(a) * 6.5).toFixed(1) + '" r="5"/>'; }
    g += '<circle class="buddy-gold" cx="' + fx + '" cy="' + fy + '" r="4"/>';
  }
  if (acc.indexOf('bud') >= 0) g += '<ellipse class="buddy-petal" cx="60" cy="' + (top - 30) + '" rx="5" ry="7"/>';
  if (acc.indexOf('flag') >= 0) g += '<path class="buddy-pole" d="M' + (60 + rx + 6) + ' ' + (cy + 10) + ' L' + (60 + rx + 6) + ' ' + (cy - 34) + '"/><path class="buddy-gold" d="M' + (60 + rx + 6) + ' ' + (cy - 34) + ' l20 7 l-20 7z"/>';
  var sp = '<path class="spark s1" d="M14 30 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/><path class="spark s2" d="M104 24 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/><path class="spark s3" d="M98 62 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6z"/>';
  return '<svg class="buddy ' + (o.cls || '') + '" viewBox="0 0 120 124" role="img" aria-label="' + (o.label || 'Sprig, your companion') + '"><g class="pose">' + g + '</g>' + sp + '</svg>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
document.querySelectorAll('[data-buddy]').forEach(function (el) {
  var a = el.getAttribute('data-buddy').split(',');
  el.innerHTML = buddySVG({ stage: +a[0], acc: a.slice(1).filter(Boolean) });
});
/* rewards setting (parent controls: full / quiet / minimal) */
function setRewards(v) { document.body.setAttribute('data-rewards', v); }

(function () {
  var books = [
    { id: 'maths', name: 'Maths', list: HB.maths, label: function (u) { return 'p. ' + u.page; }, word: 'Unit', blurb: '12 units. The sign shows the page in your Maths book.', cls: 'm' },

  var rock = '<svg class="scen" viewBox="0 0 54 40" aria-hidden="true"><path class="land2" d="M4 38 C6 18 18 8 30 10 C44 12 52 26 50 38Z"/><path class="tree" d="M18 20 q4 -10 10 0z"/></svg>';

  function trail(b) {
    var L = b.list;
    return '<ol class="trail" aria-label="' + b.name + ' trail, in book order">' + L.map(function (u, i) {
      var last = i === L.length - 1, odd = i % 2 === 0;
      var segD = odd ? 'M30 0 C30 55 70 45 70 100' : 'M70 0 C70 55 30 45 30 100';

      var here = u.state === 'going' && i === L.findIndex(function (x) { return x.state === 'going'; }) ? '<div class="here reward" data-buddy="3"></div>' : '';
      var badge = u.state === 'done' ? tick : u.state === 'going' ? flag : '';
      return '<li class="stop" style="--i:' + i + '">' + seg +
        '<div class="node ' + u.state + '" aria-hidden="true">' + u.n + (badge ? '<span class="badge">' + badge + '</span>' : '') + '</div>' + here +
        '<div class="sc"><div class="r1"><span class="sign">' + b.label(u) + '</span><span class="chip ' + b.cls + '">' + stateTxt[u.state] + '</span></div>' +
        '<h3>' + b.word + ' ' + u.n + ': ' + u.title + '</h3>' + pips(u.levelsDone) +
        '<a class="go" href="03-chapter.html">' + (u.state === 'new' ? 'Start this stop' : u.state === 'done' ? 'Visit again' : 'Carry on') + '<span class="sr"> ' + u.title + '</span> &rarr;</a></div>' +
        (i % 3 === 1 ? tree : i % 3 === 2 ? rock : '') + '</li>';
    }).join('') + '</ol>';
  }
  function plain(b) {
    var L = b.list;
    return '<div class="list"><ol>' + L.map(function (u) {
      return '<li><span class="n">' + u.n + '</span><div><b>' + u.title + '</b><div class="st">' + b.label(u) + ' · ' + stateTxt[u.state] + ' · Easy, Medium, Challenge done: ' + u.levelsDone + ' of 3</div></div><a href="03-chapter.html">Open<span class="sr"> ' + u.title + '</span> &rarr;</a></li>';
    }).join('') + '</ol></div>';

  function unseen() {
    var s = ''; for (var i = 1; i <= HB.unseen.count; i++) s += '<li><a href="04-practice.html" class="' + (i <= HB.unseen.done ? 'done' : '') + '" aria-label="Passage ' + i + (i <= HB.unseen.done ? ', finished' : '') + '">' + (i <= HB.unseen.done ? '&#10003; ' : '') + i + '</a></li>';
    return '<ol class="pebbles" aria-label="24 unseen passages">' + s + '</ol>';
  }
  function render() {
    var b = books[cur];
    document.getElementById('title').textContent = b.name + ' trail';
    document.getElementById('blurb').textContent = b.blurb;
    var out = document.getElementById('out');
    out.innerHTML = b.list ? trail(b) + plain(b) : unseen();

})();
