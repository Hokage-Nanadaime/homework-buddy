<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:24px} h3{font-size:19px}
p{margin:0} a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
main{padding-block:32px 72px}
.stack{display:grid;gap:24px}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:15px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
/* top bar */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-height:56px;padding-block:4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--leaf);display:inline-block}
.nav-wide{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav-wide a,.tb-link,.tb-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;font-size:15px;color:var(--ink2);text-decoration:none;border-radius:6px}
.nav-wide a:hover,.tb-link:hover,.tb-btn:hover{background:var(--line2);color:var(--ink)}
.nav-wide a[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--leaf);border-radius:0}
.tb-btn{border:1px solid var(--line);background:transparent;font:inherit;font-size:15px;cursor:pointer}
.nav-narrow{display:none;flex:1}
.nav-narrow summary{list-style:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;padding:0 10px;font-size:15px;color:var(--ink2);border:1px solid var(--line);border-radius:6px}
.nav-narrow summary::-webkit-details-marker{display:none}
.nav-narrow div{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding-top:6px;width:100%}
.nav-narrow a{display:flex;align-items:center;min-height:44px;padding:0 10px;text-decoration:none;color:var(--ink2);font-size:16px}
.nav-narrow a[aria-current="page"]{font-weight:700;color:var(--ink)}
@media(max-width:860px){.nav-wide{display:none}.nav-narrow{display:block}.topbar .wrap>.nav-narrow{order:3;flex-basis:100%}.nav-narrow[open]{flex-basis:100%}.nav-narrow:not([open]){flex:0 0 auto;order:0}}
.tb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn.quiet{border-color:var(--line);font-weight:400;color:var(--ink2)}
.btn:hover{filter:brightness(1.06)} .btn[disabled]{opacity:.55;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button,.seg a{min-height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:8px;font:inherit;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.seg [aria-pressed="true"],.seg [aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--leaf);border-radius:2px}
.pbar.m>i{background:var(--maths)} .pbar.e>i{background:var(--english)}
/* garden */
.plant{width:100%;max-width:120px;height:auto;display:block}
.p-leaf{fill:var(--leaf)} .p-stem{stroke:var(--leaf);stroke-width:4;fill:none;stroke-linecap:round}
.p-pot{fill:var(--pot)} .p-soil{fill:var(--soil)} .p-seed{fill:var(--seed)}
.p-bloom.m{fill:var(--maths)} .p-bloom.e{fill:var(--english)} .p-core{fill:var(--card)}
.p-bud.m{fill:var(--maths)} .p-bud.e{fill:var(--english)}
.ring-bg{stroke:var(--line);fill:none} .ring-fg{stroke:var(--leaf);fill:none;stroke-linecap:round}
.ring-paused .ring-fg{stroke:var(--muted);stroke-dasharray:2 7!important}
@media(max-width:700px){body{font-size:17px}main{padding-block:20px 56px}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.noprint{display:none!important}body{background:var(--card)}}


.rep{display:grid;gap:28px}
.rhead{display:grid;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.rtop{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;align-items:center}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sum div{display:grid;gap:2px;border-top:3px solid var(--line);padding-top:10px}
.sum b{font-family:var(--f-display);font-size:38px;font-variant-numeric:tabular-nums;line-height:1.1}
.sec{display:grid;gap:14px;padding-top:8px}
.sec>header{display:grid;gap:4px;max-width:70ch}
.sec h2{font-size:23px}
.fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px;min-width:0}
.cv{position:relative;min-width:0}
.tv{display:none;overflow-x:auto}
.tables .cv{display:none}.tables .tv{display:block}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:15px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);fill:var(--ink2);font-size:12px}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cm{stroke:var(--surf);stroke-width:2}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}
.chart .lab{fill:var(--ink);font-weight:700;font-size:13px}
.chart .na{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35;z-index:3;white-space:nowrap;display:none}
.tip b{display:block}
.small3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mini{display:grid;gap:6px;min-width:0}
.mini h3{font-size:17px}.mini p{font-size:15px;color:var(--ink2)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hc{border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-height:76px;align-content:space-between}
.hc b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.hc span{font-size:14px;line-height:1.25}
.hc.h1{background:var(--h1);color:var(--h1t)}.hc.h2{background:var(--h2);color:var(--h2t)}.hc.h3{background:var(--h3);color:var(--h3t)}.hc.h4{background:var(--h4);color:var(--h4t)}.hc.h5{background:var(--h5);color:var(--h5t)}
.hc.hn{background:repeating-linear-gradient(45deg,var(--hnone),var(--hnone) 6px,var(--card) 6px,var(--card) 8px);color:var(--ink2);border:1px dashed var(--line)}
.hl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.hl i{width:30px;height:16px;border-radius:3px;display:inline-block}
.tk{margin:2px 132px 0 162px}.hrow>*{min-width:0}.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:12px;align-items:center;min-height:44px}
.track{position:relative;height:6px;background:var(--line);border-radius:3px}
.dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--c1);background:var(--card)}
.dot.now{background:var(--c1)}
.span{position:absolute;top:0;height:6px;background:var(--c1);opacity:.35}
.hrow.e .dot{border-color:var(--c2)}.hrow.e .dot.now{background:var(--c2)}.hrow.e .span{background:var(--c2)}
.hrow.o .dot{border-color:var(--c3)}.hrow.o .dot.now{background:var(--c3)}.hrow.o .span{background:var(--c3)}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(120px,230px) minmax(0,1fr) 44px;gap:12px;align-items:center;min-height:36px}
.br .t{height:14px;background:var(--line2);border-radius:2px}
.br .t i{display:block;height:100%;background:var(--c3);border-radius:0 4px 4px 0}
.br.lv .t i{background:var(--c1)}
.br b{font-variant-numeric:tabular-nums;text-align:right}
.cols6{display:flex;gap:6px;align-items:flex-end;height:110px;border-bottom:1px solid var(--line)}
.cols6 div{flex:1;display:grid;justify-items:center;align-content:end;gap:2px;height:100%}
.cols6 i{display:block;width:100%;background:var(--c1);border-radius:4px 4px 0 0}
.cols6 span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:6px;font-size:12px;color:var(--muted)}.xl span{flex:1;text-align:center}
.soon{border:2px dashed var(--note-line);background:var(--note-bg);color:var(--note-ink);border-radius:10px;padding:18px;display:grid;gap:10px}
.soon .tag{justify-self:start;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--note-line);border-radius:999px;padding:2px 10px}
.soon .bars .t{background:var(--note-line);opacity:.35}.soon .bars .t i{background:var(--note-ink)}
.ex{display:grid;gap:10px}
.rng{position:relative;height:22px;background:var(--line2);border-radius:4px;margin:8px 0 2px}
.rng i{position:absolute;top:0;bottom:0;background:var(--c1);border-radius:4px}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.next{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.next li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}

.two,.two2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:14px;color:var(--ink2)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--ink2)}
@media(max-width:820px){.small3,.two,.two2{grid-template-columns:1fr}.tk{margin:2px 0 0}.hrow{grid-template-columns:minmax(0,1fr) auto;}.hrow .track{grid-column:1/3;grid-row:2}.br{grid-template-columns:minmax(100px,1fr) minmax(0,1fr) 36px}.sum b{font-size:30px}}
@media print{.fig,.soon{break-inside:avoid}}

(function(){
  var root=document.documentElement;
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches}
  function label(){var b=document.getElementById('themeBtn');if(b)b.textContent=isDark()?'Light mode':'Dark mode'}
  window.toggleTheme=function(){root.setAttribute('data-theme',isDark()?'light':'dark');label();document.dispatchEvent(new Event('themechange'))};
  document.addEventListener('DOMContentLoaded',function(){label();var b=document.getElementById('themeBtn');if(b)b.addEventListener('click',window.toggleTheme)});
  var urlT=(location.search.match(/theme=(light|dark)/)||[])[1];if(urlT)root.setAttribute('data-theme',urlT);
})();
/* Garden helpers. Growth stages: 0 Seed, 1 Sprout, 2 Seedling, 3 Growing, 4 In bloom. Never wilts; may be "paused". */
var STAGES=['Seed','Sprout','Seedling','Growing','In bloom'], STAGE_AT=[0,1,6,12,24];
function stageFor(n){var s=0;STAGE_AT.forEach(function(t,i){if(n>=t)s=i});return s}
function levelsTotal(list){return list.reduce(function(a,u){return a+u.levelsDone},0)}
function plantSVG(stage,kind,title){
  var L=function(x,y,r,rx){return '<ellipse class="p-leaf" cx="'+x+'" cy="'+y+'" rx="'+(rx||13)+'" ry="6" transform="rotate('+r+' '+x+' '+y+')"/>'};
  var s='<svg class="plant" viewBox="0 0 120 150" role="img" aria-label="'+title+'">';
  s+='<path class="p-pot" d="M32 112h56l-7 32H39z"/><rect class="p-pot" x="28" y="106" width="64" height="10" rx="3"/><ellipse class="p-soil" cx="60" cy="108" rx="28" ry="4"/>';
  if(stage===0){s+='<ellipse class="p-seed" cx="60" cy="106" rx="6" ry="3.5"/>'}
  if(stage>=1){s+='<path class="p-stem" d="M60 106V'+[0,88,70,40,34][stage]+'"/>'}
  if(stage===1){s+=L(52,88,-30,10)+L(68,88,30,10)}
  if(stage>=2){s+=L(48,96,-25)+L(72,90,25)}
  if(stage>=2&&stage<3){s+=L(50,76,-30,11)+L(70,72,30,11)}
  if(stage>=3){s+=L(46,78,-28)+L(74,70,28)+L(48,58,-30,12)+L(72,52,30,12)}
  if(stage===3){s+='<circle class="p-bud '+kind+'" cx="60" cy="34" r="7"/>'}
  if(stage===4){for(var i=0;i<6;i++){s+='<ellipse class="p-bloom '+kind+'" cx="60" cy="18" rx="7" ry="12" transform="rotate('+(i*60)+' 60 34)"/>'}s+='<circle class="p-core" cx="60" cy="34" r="6"/>'}
  return s+'</svg>';
}
function ringSVG(done,goal,paused,size){
  var r=44,c=2*Math.PI*r,f=Math.min(1,done/goal);
  return '<svg class="'+(paused?'ring-paused':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 110 110" role="img" aria-label="'+(paused?'Daily goal paused':done+' of '+goal+' minutes today')+'">'
   +'<circle class="ring-bg" cx="55" cy="55" r="'+r+'" stroke-width="9"/>'
   +'<circle class="ring-fg" cx="55" cy="55" r="'+r+'" stroke-width="9" transform="rotate(-90 55 55)" stroke-dasharray="'+(paused?'':(c*f)+' '+c)+'"/>'
   +'<text x="55" y="53" text-anchor="middle" font-family="var(--f-display)" font-size="26" font-weight="600" fill="var(--ink)">'+(paused?'Rest':done)+'</text>'
   +'<text x="55" y="73" text-anchor="middle" font-size="12" fill="var(--muted)">'+(paused?'day':'of '+goal+' min')+'</text></svg>';
}

<script>

var kid=HB.kids[0], H=HB.history;
var SAMPLE_START='26 Aug', MIN=10;
function tbl(head,rows){return '<table><thead><tr>'+head.map(function(h){return '<th scope="col">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return i?'<td>'+c+'</td>':'<th scope="row" style="text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink);font-weight:400">'+c+'</th>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
function fig(id,title,legend,tableHtml,note){return '<figure class="fig" aria-label="'+title+'">'+(legend||'')+'<div class="cv chart" id="'+id+'"></div><div class="tv">'+tableHtml+'</div>'+(note?'<figcaption class="small muted">'+note+'</figcaption>':'')+'</figure>'}
function sec(title,lead,inner){return '<section class="sec"><header><h2>'+title+'</h2><p class="muted">'+lead+'</p></header>'+inner+'</section>'}
function legend(items){return '<div class="legend">'+items.map(function(i){return '<span><svg viewBox="0 0 26 10" aria-hidden="true"><line x1="0" y1="5" x2="26" y2="5" class="ln '+i[1]+'" stroke-width="3"/><circle cx="13" cy="5" r="4" class="cm f'+i[1].slice(1)+'"/></svg>'+i[0]+'</span>'}).join('')+'</div>'}
var charts=[];
function lineChart(id,o){charts.push([id,o]);}
function drawLine(id,o){
  var el=document.getElementById(id);if(!el)return;var W=el.clientWidth||320,Ht=o.h||230,m={l:36,r:o.r||84,t:14,b:36};
  var pw=W-m.l-m.r,ph=Ht-m.t-m.b,n=o.labels.length;
  var X=function(i){return m.l+(n===1?pw/2:i*pw/(n-1))}, Y=function(v){return m.t+ph-(v-o.min)/(o.max-o.min)*ph};
  var s='<svg viewBox="0 0 '+W+' '+Ht+'" width="'+W+'" height="'+Ht+'" role="img" aria-label="'+o.aria+'">';
  for(var t=o.min;t<=o.max+0.001;t+=o.step){s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text x="'+(m.l-8)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t+(o.unit||'')+'</text>'}
  var skip=W<460?2:1;
  o.labels.forEach(function(l,i){if(i%skip===(n-1)%skip)s+='<text x="'+X(i)+'" y="'+(Ht-12)+'" text-anchor="middle">'+l+'</text>'});
  var ends=[];
  o.series.forEach(function(se){
    var d='',pen=false;se.vals.forEach(function(v,i){if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true});
    s+='<path class="ln '+se.cls+'" d="'+d+'"/>';
    se.vals.forEach(function(v,i){if(v==null){s+='<line class="grid" x1="'+X(i)+'" x2="'+X(i)+'" y1="'+m.t+'" y2="'+(m.t+ph)+'" stroke-dasharray="3 4"/><text class="na" x="'+(X(i)+4)+'" y="'+(m.t+ph-6)+'" transform="rotate(-90 '+(X(i)+4)+' '+(m.t+ph-6)+')">Not enough data yet</text>';return}
      s+='<circle class="cm f'+se.cls.slice(1)+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===n-1?5:3.5)+'"/>'});
    var last=se.vals.length-1;while(last>0&&se.vals[last]==null)last--;ends.push({y:Y(se.vals[last]),t:se.name+' '+se.vals[last]+(o.unit||'')});
  });
  ends.sort(function(a,b){return a.y-b.y});for(var i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;
  ends.forEach(function(e){s+='<text class="lab" x="'+(W-m.r+8)+'" y="'+(e.y+4)+'">'+e.t+'</text>'});
  s+='<line class="axis" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(m.t+ph)+'" y2="'+(m.t+ph)+'"/><line id="cx-'+id+'" class="axis" y1="'+m.t+'" y2="'+(m.t+ph)+'" style="display:none"/><rect x="'+m.l+'" y="0" width="'+pw+'" height="'+Ht+'" fill="transparent" id="hit-'+id+'"/></svg><div class="tip" id="tip-'+id+'"></div>';
  el.innerHTML=s;
  var hit=document.getElementById('hit-'+id),tip=document.getElementById('tip-'+id),cx=document.getElementById('cx-'+id);
  function show(ev){var r=hit.getBoundingClientRect();var i=Math.round((ev.clientX-r.left)/r.width*(n-1));i=Math.max(0,Math.min(n-1,i));
    cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.style.display='';
    tip.innerHTML='<b>Week of '+o.labels[i]+'</b>'+o.series.map(function(se){return se.name+': '+(se.vals[i]==null?'not enough data yet':se.vals[i]+(o.unit||''))}).join('<br>');
    tip.style.display='block';var tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(W-tw,X(i)+12))+'px';tip.style.top='10px'}
  function hide(){tip.style.display='none';cx.style.display='none'}
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',hide);
}

   fig('x1','Start and now by subject',null,tbl(['Area','Start','Now','Change'],dum.map(function(d){return [d[0],d[2]+'% ('+d[4]+')',d[3]+'%','+'+(d[3]-d[2])]})),'')+'');

   '<figure class="fig"><div class="small3">'+tk.map(function(k,i){var v=H.topics[k],f=v.filter(function(x){return x!=null}),d=f[f.length-1]-f[0];
     var msg=i===0?'Growing: +'+d+' points since week 1.':i===1?'Flat: '+f[0]+'% to '+f[f.length-1]+'% over six weeks. Plateau.':'Growing: +'+d+' points. First week had too few answers.';
     return '<div class="mini"><h3>'+k.split(' · ')[0]+'</h3><p>'+k.split(' · ')[1]+'</p><div class="cv chart" id="tp'+i+'"></div><p><b>'+msg+'</b></p></div>'}).join('')+'</div><div class="tv">'+tt+'</div></figure>');
  tk.forEach(function(k,i){lineChart('tp'+i,{labels:H.weeks,min:0,max:100,step:50,unit:'%',h:190,r:40,aria:k+' weekly accuracy',series:[{name:'',vals:H.topics[k],cls:cls[i]}]})});

   +'<div class="hl" style="margin-top:12px"><span>Lower</span><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i><span>Higher</span></div></div><div class="tv">'+tbl(['Chapter','Accuracy'],hk.map(function(k){return [k,H.heat[k]==null?'not tried yet':H.heat[k]+'%']}))+'</div></figure>');

  /* 11 rewards */
  h+=sec('Rewards at a glance','','<div class="soon"><span class="tag">Design intent</span><p>Reward settings are not stored yet. In the finished app a parent chooses <b>Full</b>, <b>Gentle</b> or <b>Minimal</b>. Minimal hides the garden and daily goal and shows a plain tick at the end of each set. No setting adds lives, ranking or lost streaks.</p><div class="seg" id="rwSeg" role="group" aria-label="Reward level (preview only)"><button type="button" aria-pressed="false">Full</button><button type="button" aria-pressed="true">Gentle</button><button type="button" aria-pressed="false">Minimal</button></div></div>');
  c.innerHTML=h;

  drawAll();
  var rw=document.getElementById('rwSeg');rw&&rw.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(rw.children,function(x){x.setAttribute('aria-pressed',x===b)})});
}
