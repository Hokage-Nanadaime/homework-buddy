<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<header style="box-sizing:border-box;width:100%;min-height:72px;padding:12px 40px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;background:var(--card);border-bottom:2px solid var(--line);font-family:var(--body);color:var(--ink)">
  <a href="Main.dc.html" style="display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:24px">
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" style="fill:var(--ink)"/><polygon points="20,8 23.5,15.5 31.7,16.5 25.6,22 27.3,30 20,26 12.7,30 14.4,22 8.3,16.5 16.5,15.5" style="fill:var(--gold)"/></svg>
    Homework Buddy
  </a>
  <nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:8px;flex-grow:1">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <sc-if value="{{tab.on}}" hint-placeholder-val="{{false}}">
        <a href="{{tab.href}}" aria-current="page" style="box-sizing:border-box;min-height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:16px">
          {{tab.label}}
          <sc-if value="{{tab.lock}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </sc-if>
        </a>
      </sc-if>
      <sc-if value="{{tab.off}}" hint-placeholder-val="{{true}}">
        <a href="{{tab.href}}" style="box-sizing:border-box;min-height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:999px;background:transparent;color:var(--ink);font-weight:800;font-size:16px">
          {{tab.label}}
          <sc-if value="{{tab.lock}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <div style="display:flex;align-items:center;gap:12px">
    <span aria-hidden="true" style="width:44px;height:44px;border-radius:50%;background:var(--maths-tint);color:var(--maths-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px">M</span>
    <div style="display:flex;flex-direction:column;line-height:1.2">
      <span style="font-weight:800;font-size:16px">Mia</span>
      <span style="font-size:14px;color:var(--muted)">Grade 3</span>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","maths","make","quest","progress"]},"$preview":{"width":1280,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const tabs = [
      { id: 'home', label: 'Home', href: 'Main.dc.html', lock: false },
      { id: 'maths', label: 'Maths', href: 'MathsIndex.dc.html', lock: false },
      { id: 'make', label: 'Make homework', href: 'MathsMaker.dc.html', lock: true },
      { id: 'quest', label: 'Word Quest', href: 'WordQuest.dc.html', lock: false },
      { id: 'progress', label: 'Progress', href: 'Progress.dc.html', lock: true }
    ];
    return {
      tabs: tabs.map((t) => ({ ...t, on: t.id === active, off: t.id !== active }))
    };
  }
}
</script>
</body>
</html>
